[project]
name = "jornalismo-de-dados"
version = "0.1.0"
description = "Processamento de Linguagem Natural para jornalismo de dados"
readme = "README.md"
authors = [
    { name = "Ana Schwendler", email = "schwendler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jupyterlab>=4.6.5",
    "nltk>=3.10.4",
    "pandas>=3.1.0",
    "pt-core-news-sm",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "spacy>=3.8.18",
    "wordcloud>=1.9.6",
]

[tool.uv.sources]
pt-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl" }
